plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.zcbs.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.zcbs.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'wasm', 'data', 'qst', 'js', 'json', 'spc'
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:__GECKO_VERSION__'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
