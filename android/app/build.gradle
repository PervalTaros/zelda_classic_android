plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.zcbs.app'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.zcbs.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'wasm', 'data', 'qst', 'js', 'json', 'spc'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
