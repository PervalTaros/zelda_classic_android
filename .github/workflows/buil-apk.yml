name: Construire l'APK

on:
  workflow_dispatch:
    inputs:
      zc_ref:
        description: "Version de ZQuest Classic à compiler (tag)"
        default: "2.55.17"

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Récupérer ce projet
        uses: actions/checkout@v4

      - name: Libérer de la place disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Récupérer ZQuest Classic
        uses: actions/checkout@v4
        with:
          repository: ZQuestClassic/ZQuestClassic
          ref: ${{ inputs.zc_ref }}
          path: zc
          lfs: false

      - name: Historique et tags (pour le numéro de version)
        working-directory: zc
        run: git fetch --filter=blob:none --unshallow --tags origin || git fetch --tags origin

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Outils de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build flex bison
          pip install -r zc/requirements.txt || true

      - name: Installer emsdk (même version que le projet officiel)
        run: |
          VER=$(grep -m1 '^EMCC_VERSION=' zc/scripts/configure_emscripten.sh | cut -d= -f2)
          echo "Version emsdk : $VER"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install $VER
          ~/emsdk/emsdk activate $VER
          source ~/emsdk/emsdk_env.sh
          echo "$EMSDK" >> $GITHUB_PATH
          echo "$EMSDK/upstream/emscripten" >> $GITHUB_PATH
          echo "EMSDK=$EMSDK" >> $GITHUB_ENV
          echo "EMSDK_NODE=$EMSDK_NODE" >> $GITHUB_ENV

      - name: Compiler unsf (conversion des banques de sons)
        run: |
          git clone https://github.com/psi29a/unsf.git
          cd unsf
          cmake -S . -B build .
          cmake --build build
          echo "UNSF=$PWD/build/unsf-static" >> $GITHUB_ENV

      - name: Configurer Emscripten
        working-directory: zc
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          bash scripts/configure_emscripten.sh
        env:
          ZC_EMCC_CMAKE_EXTRA_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Ajouter de la mémoire d'échange
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Compiler le lecteur web (zplayer seul)
        working-directory: zc
        run: |
          cmake --build build_emscripten --config Release -t web_zplayer || \
          cmake --build build_emscripten --config Release -t web

      - name: Archive du lecteur web
        uses: actions/upload-artifact@v4
        with:
          name: lecteur-web
          path: zc/build_emscripten/Release/packages/web
          retention-days: 7

      - name: Assembler les ressources de l'application
        run: |
          A=android/app/src/main/assets
          mkdir -p $A/www $A/quests $A/app
          cp -r zc/build_emscripten/Release/packages/web/* $A/www/
          rm -f $A/www/sw.js
          cp -r quests/* $A/quests/
          cp -r launcher/* $A/app/
          python3 scripts/make_index.py $A/quests
          du -sh $A

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Construire l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: zelda-bs-apk
          path: android/app/build/outputs/apk/debug/*.apk
